name: Docker smoke test

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - code/**
      - configs/**
      - .github/workflows/docker-smoke.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      - code/**
      - configs/**
      - .github/workflows/docker-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build reproducibility image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ttl.sh/7f234f37-8a38-4e31-8f73-4cefb68ae2b0:24h
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Verify packaged runtime
        run: docker run --rm ttl.sh/7f234f37-8a38-4e31-8f73-4cefb68ae2b0:24h verify
